name: Logistics P0 validation
on:
  push:
    branches: [feat/logistics-p0]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    env:
      SIM_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium webkit
      - name: Validate equipment and integration
        run: npm test
      - name: Validate logistics and procedural pixels
        run: node tests/logistics.cjs
      - name: Run optional seeded economy suite
        if: github.event_name == 'workflow_dispatch'
        run: node tests/economy-sim.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logistics-p0-reports-${{ matrix.engine }}
          path: reports/
